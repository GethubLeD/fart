<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7354e8"><title>Fart - Étape 3</title><style>
:root{--v:#7354e8;--v2:#a550df;--m:#45d5ae;--ink:#131a3c;--mut:#707590;--danger:#e44b6d}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:linear-gradient(145deg,#eafff8,#fff 48%,#eeeaff)}button,input,select{font:inherit}.app{max-width:600px;min-height:100vh;margin:auto;padding:18px 18px 105px;background:#ffffffdf}.top,.row,.head{display:flex;align-items:center}.top,.head{justify-content:space-between}.brand{gap:10px;font-weight:950;font-size:23px}.logo{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--m),#4bbfca);color:#fff}.tag{font-size:10px;color:var(--v);letter-spacing:.15em}.home{text-align:center;padding-top:7vh}.stage{position:relative;width:310px;height:290px;margin:auto;display:grid;place-items:center}.blob{position:absolute;inset:25px;border-radius:44% 56% 62% 38%/50% 42% 58% 50%;background:linear-gradient(145deg,#7a5de8,#6688ec 58%,#4bd1b1);filter:drop-shadow(0 20px 26px #7558d630);transform:scale(var(--s,1));transition:.06s;animation:blob 6s infinite ease-in-out}.blob:after{content:"";position:absolute;inset:-12px;background:#9d65df33;border-radius:58% 42% 37% 63%/43% 60% 40% 57%}.rec{position:relative;z-index:2;width:150px;height:150px;border:0;border-radius:50%;background:#ffffff18;color:#fff;font-size:58px;box-shadow:inset 0 0 0 1px #ffffff40,0 16px 34px #49388d45;touch-action:none}.recording .blob{animation-duration:.8s}.meter{display:flex;justify-content:center;align-items:baseline;gap:16px;margin-top:-8px}.timer{font-size:42px;font-weight:950}.db{font-weight:900;color:var(--v);min-width:78px}.muted{color:var(--mut);line-height:1.5}.note{background:#f0edff;color:#5c4b9d;padding:12px;border-radius:15px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,600px);display:grid;grid-template-columns:1fr 1fr;background:#fffffff5;border-top:1px solid #e8e4f4;padding:9px 14px}.nav button{border:0;min-height:55px;border-radius:15px;background:transparent;font-weight:850;color:var(--mut)}.nav .on{background:#efecff;color:var(--v)}h2{font-size:29px}.tools{display:grid;grid-template-columns:1fr 150px;gap:9px}.field,select{width:100%;padding:13px;border:1px solid #e4e0f2;border-radius:15px;background:#fff}.list{display:grid;gap:12px;margin-top:14px}.card{background:#fff;border:1px solid #efedf7;border-radius:22px;padding:15px;box-shadow:0 13px 35px #3029670d}.grow{flex:1;min-width:0}.name{font-size:18px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:13px;color:var(--mut)}.play,.icon{width:46px;height:46px;border:0;border-radius:14px}.play{background:#e8fff7;color:#127d64}.icon{background:#f2efff;color:var(--v)}.trash{background:#ffedf1;color:var(--danger)}.rating button{border:0;background:transparent;color:var(--v);font-size:13px;font-weight:900;padding:10px 2px}.overlay{position:fixed;z-index:20;inset:0;background:#12163288;display:grid;place-items:end center;padding:14px}.modal{width:min(100%,560px);max-height:94vh;overflow:auto;background:#fff;border-radius:28px 28px 18px 18px;padding:22px}.wave{height:115px;background:#f1eeff;border-radius:20px;margin:15px 0;position:relative;overflow:hidden}.wave canvas{width:100%;height:100%}.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:17px}.primary,.secondary,.danger{border:0;border-radius:15px;padding:13px 16px;font-weight:900}.primary{background:linear-gradient(135deg,var(--v),var(--v2));color:#fff}.secondary{background:#f0eef8}.danger{background:#ffe8ee;color:#b82149}.toast{position:fixed;z-index:30;left:50%;bottom:95px;transform:translate(-50%,20px);opacity:0;background:#1b1e3c;color:#fff;padding:13px 18px;border-radius:15px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.trim-wrap{position:relative}.trim-shade{position:absolute;top:0;bottom:0;background:rgba(228,75,109,.25);pointer-events:none}.trim-shade.left{left:0}.trim-shade.right{right:0}.handles{position:absolute;inset:0;pointer-events:none}.handle{position:absolute;top:0;bottom:0;width:5px;background:var(--v);transform:translateX(-50%);pointer-events:none}.handle:before{content:"";position:absolute;top:50%;left:50%;width:30px;height:54px;border-radius:15px;background:var(--v);transform:translate(-50%,-50%);opacity:.92}.trim-controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}.trim-controls label{font-size:13px;color:var(--mut)}input[type=range]{width:100%;min-height:42px;accent-color:var(--v)}.selection{text-align:center;font-weight:950;font-size:24px;color:var(--v)}.progress{position:absolute;top:0;bottom:0;width:3px;background:#151a3c;left:0;pointer-events:none}.wave.seekable{cursor:pointer}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail-grid button{min-height:50px}@keyframes blob{50%{border-radius:61% 39% 45% 55%/39% 58% 42% 61%;transform:scale(calc(var(--s,1)*1.03)) rotate(8deg)}}@media(max-width:420px){.stage{width:282px;height:265px}.rec{width:140px;height:140px}.tools{grid-template-columns:1fr}}
</style></head><body><main class="app" id="app"></main><div class="toast" id="toast"></div><script>
const $=s=>document.querySelector(s),toast=$('#toast');let state={page:'home',sounds:[],recording:false,stream:null,rec:null,chunks:[],ctx:null,an:null,data:null,start:0,raf:0,draft:null,playing:null,q:'',sort:'recent'};const DB='fart-db',STORE='sounds';
function note(s){toast.textContent=s;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)}function fmt(v){return Math.floor(v/60)+':'+(v%60).toFixed(1).padStart(4,'0')}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function all(){let db=await openDB();return new Promise((ok,no)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function put(s){let db=await openDB();return new Promise((ok,no)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).put(s);r.onsuccess=ok;r.onerror=()=>no(r.error)})}async function del(id){let db=await openDB();return new Promise((ok,no)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=ok;r.onerror=()=>no(r.error)})}
function render(){app.innerHTML=`<header class="top"><div class="brand row"><span class="logo">F</span><span>Fart<br><small class="tag">ÉTAPE 4 · ROGNAGE RÉEL</small></span></div></header>${state.page==='home'?home():library()}<nav class="nav"><button class="${state.page==='home'?'on':''}" data-p="home">🎙️ Accueil</button><button class="${state.page==='library'?'on':''}" data-p="library">🎵 Bibliothèque</button></nav>`;document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{stopPlay();state.page=b.dataset.p;render()});state.page==='home'?bindHome():bindLib()}
function home(){return `<section class="home"><div class="stage" id="stage"><div class="blob" id="blob"></div><button class="rec" id="rec">🎙️</button></div><div class="meter"><span class="timer" id="timer">0:00.0</span><span class="db" id="db">-- dB</span></div><h2 id="status">Maintiens pour enregistrer</h2><p class="muted" id="hint">L’autorisation est demandée au premier appui.</p><p class="note">Les sons sont maintenant sauvegardés sur cet appareil avec IndexedDB.</p></section>`}
function library(){let a=state.sounds.filter(s=>s.name.toLowerCase().includes(state.q.toLowerCase()));if(state.sort==='best')a.sort((x,y)=>y.rating-x.rating);else if(state.sort==='alpha')a.sort((x,y)=>x.name.localeCompare(y.name));else a.sort((x,y)=>y.created-x.created);return `<section><div class="head"><h2>Bibliothèque</h2><b class="muted">${state.sounds.length} / 100 sons</b></div><div class="tools"><input id="search" class="field" value="${esc(state.q)}" placeholder="Rechercher"><select id="sort"><option value="recent">Plus récents</option><option value="best" ${state.sort==='best'?'selected':''}>Meilleure note</option><option value="alpha" ${state.sort==='alpha'?'selected':''}>Ordre alphabétique</option></select></div><div class="list">${a.length?a.map(card).join(''):'<p class="muted">Aucun son enregistré</p>'}</div></section>`}
function card(s){return `<article class="card"><div class="row"><button class="play" data-play="${s.id}">${state.playing?.id===s.id?'⏸':'▶'}</button><div class="grow"><div class="name">${esc(s.name)}</div><div class="meta">${fmt((s.trimEnd??s.duration)-(s.trimStart??0))} · ${new Date(s.created).toLocaleDateString()} · ${esc(s.mime)}</div></div><button class="icon" data-more="${s.id}">•••</button><button class="icon trash" data-del="${s.id}">🗑️</button></div><div class="rating">${[1,2,3,4,5].map(n=>`<button data-rate="${s.id}:${n}">(${n<=s.rating?'o':'x'})</button>`).join('')}</div></article>`}
function bindHome(){let b=$('#rec');b.onpointerdown=e=>{e.preventDefault();startRec()};window.onpointerup=()=>state.recording&&stopRec();b.oncontextmenu=e=>e.preventDefault()}
function mime(){return ['audio/webm;codecs=opus','audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/webm'].find(x=>MediaRecorder.isTypeSupported?.(x))||''}async function startRec(){if(state.recording)return;try{state.stream=await navigator.mediaDevices.getUserMedia({audio:true});state.ctx=new (AudioContext||webkitAudioContext)();let src=state.ctx.createMediaStreamSource(state.stream);state.an=state.ctx.createAnalyser();state.an.fftSize=1024;src.connect(state.an);state.data=new Float32Array(1024);let m=mime();state.rec=new MediaRecorder(state.stream,m?{mimeType:m}:{});state.chunks=[];state.rec.ondataavailable=e=>e.data.size&&state.chunks.push(e.data);state.rec.onstop=finish;state.rec.start(250);state.recording=true;state.start=performance.now();$('#stage').classList.add('recording');loop()}catch(e){note(e.name==='NotAllowedError'?'Microphone refusé. Autorise-le dans les réglages du navigateur.':'Microphone indisponible.')}}function loop(){if(!state.recording)return;let d=(performance.now()-state.start)/1000;state.an.getFloatTimeDomainData(state.data);let rms=Math.sqrt(state.data.reduce((a,x)=>a+x*x,0)/state.data.length),db=Math.max(-60,20*Math.log10(rms||1e-6)),p=Math.max(0,Math.min(1,(db+55)/45));$('#timer').textContent=fmt(Math.min(20,d));$('#db').textContent=Math.round(db)+' dB';$('#status').textContent='Enregistrement en cours';$('#hint').textContent='Relâche pour arrêter';$('#blob').style.setProperty('--s',1+p*.16);if(d>=20)return stopRec();state.raf=requestAnimationFrame(loop)}function stopRec(){if(!state.recording)return;state.recording=false;cancelAnimationFrame(state.raf);state.rec.stop()}async function finish(){let duration=Math.min(20,(performance.now()-state.start)/1000),type=state.rec.mimeType||'audio/webm',blob=new Blob(state.chunks,{type});state.stream.getTracks().forEach(x=>x.stop());state.ctx.close();if(duration<.3||!blob.size){note('Enregistrement trop court.');render();return}state.draft={blob,mime:type,duration,peaks:await peaks(blob)};preview()}
async function peaks(blob){try{let c=new (AudioContext||webkitAudioContext)(),b=await c.decodeAudioData(await blob.arrayBuffer()),d=b.getChannelData(0),out=[],size=Math.max(1,Math.floor(d.length/100));for(let i=0;i<100;i++){let m=0;for(let j=0;j<size;j++)m=Math.max(m,Math.abs(d[i*size+j]||0));out.push(m)}c.close();return out}catch{return Array.from({length:100},(_,i)=>.2+Math.abs(Math.sin(i*.4))*.6)}}
function overlay(h){let o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="modal">'+h+'</div>';document.body.append(o);return o}function draw(c,p){let r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;let x=c.getContext('2d');x.scale(d,d);x.fillStyle='#7354e8';p.forEach((v,i)=>{let w=r.width/p.length,h=Math.max(3,v*r.height*.8);x.fillRect(i*w,(r.height-h)/2,Math.max(2,w*.6),h)})}
function preview(){let d=state.draft,o=overlay(`<h2>Préécoute</h2><p class="muted">${fmt(d.duration)} · ${esc(d.mime)}</p><div class="wave"><canvas></canvas></div><button class="secondary" id="listen">▶ Lire</button><p><input id="name" class="field" value="Fart ${String(state.sounds.length+1).padStart(3,'0')}"></p><div class="actions"><button class="danger" id="discard">Abandonner</button><button class="primary" id="save">Enregistrer</button></div>`);draw(o.querySelector('canvas'),d.peaks);let url=URL.createObjectURL(d.blob),a=new Audio(url);o.querySelector('#listen').onclick=e=>{if(a.paused){a.play();e.target.textContent='⏸ Pause'}else{a.pause();e.target.textContent='▶ Lire'}};o.querySelector('#discard').onclick=()=>{a.pause();URL.revokeObjectURL(url);o.remove();render()};o.querySelector('#save').onclick=async()=>{let s={id:crypto.randomUUID(),name:o.querySelector('#name').value.trim()||'Fart',blob:d.blob,mime:d.mime,duration:d.duration,peaks:d.peaks,rating:0,created:Date.now(),trimStart:0,trimEnd:d.duration};await put(s);state.sounds=await all();a.pause();URL.revokeObjectURL(url);o.remove();render();note('Son sauvegardé sur cet appareil')}}
function bindLib(){$('#search').oninput=e=>{state.q=e.target.value;render()};$('#sort').onchange=e=>{state.sort=e.target.value;render()};document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=async()=>{let[id,n]=b.dataset.rate.split(':'),s=state.sounds.find(x=>x.id===id);s.rating=s.rating===+n?0:+n;await put(s);render()});document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>play(b.dataset.play));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>remove(b.dataset.del));document.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>detail(b.dataset.more))}function stopPlay(){if(state.playing){state.playing.audio.pause();URL.revokeObjectURL(state.playing.url);state.playing=null}}function play(id){if(state.playing?.id===id){stopPlay();render();return}stopPlay();let s=state.sounds.find(x=>x.id===id),u=URL.createObjectURL(s.blob),a=new Audio(u),start=s.trimStart??0,end=s.trimEnd??s.duration;a.currentTime=start;state.playing={id,audio:a,url:u};a.play();a.ontimeupdate=()=>{if(a.currentTime>=end){stopPlay();render()}};a.onended=()=>{stopPlay();render()};render()}
function remove(id){let o=overlay('<h2>Supprimer définitivement ce son ?</h2><p class="muted">Cette action est définitive.</p><div class="actions"><button class="secondary" id="no">Annuler</button><button class="danger" id="yes">Supprimer</button></div>');o.querySelector('#no').onclick=()=>o.remove();o.querySelector('#yes').onclick=async()=>{stopPlay();await del(id);state.sounds=await all();o.remove();render();note('Son supprimé')}}function detail(id){let s=state.sounds.find(x=>x.id===id),start=s.trimStart??0,end=s.trimEnd??s.duration,o=overlay(`<h2>${esc(s.name)}</h2><p class="muted">Durée conservée : ${fmt(end-start)} · Original : ${fmt(s.duration)}</p><div class="wave seekable" id="detailWave"><canvas></canvas><i class="progress" id="detailProgress"></i></div><div class="detail-grid"><button class="secondary" id="listen">▶ Lire</button><button class="secondary" id="trim">✂️ Rogner</button><button class="secondary" id="renameBtn">✏️ Renommer</button><button class="danger" id="deleteBtn">🗑️ Supprimer</button></div><div class="actions"><button class="primary" id="close">Fermer</button></div>`);draw(o.querySelector('canvas'),s.peaks);let url=URL.createObjectURL(s.blob),a=new Audio(url),playBtn=o.querySelector('#listen'),prog=o.querySelector('#detailProgress');function stop(){a.pause();a.currentTime=start;playBtn.textContent='▶ Lire';prog.style.left='0%'}a.onloadedmetadata=()=>a.currentTime=start;a.ontimeupdate=()=>{if(a.currentTime>=end){stop();return}prog.style.left=`${Math.max(0,(a.currentTime-start)/(end-start))*100}%`};playBtn.onclick=()=>{if(a.paused){if(a.currentTime<start||a.currentTime>=end)a.currentTime=start;a.play();playBtn.textContent='⏸ Pause'}else stop()};o.querySelector('#detailWave').onclick=e=>{let r=e.currentTarget.getBoundingClientRect();a.currentTime=start+(e.clientX-r.left)/r.width*(end-start)};o.querySelector('#close').onclick=()=>{a.pause();URL.revokeObjectURL(url);o.remove()};o.querySelector('#trim').onclick=()=>{a.pause();URL.revokeObjectURL(url);o.remove();trimModal(id)};o.querySelector('#renameBtn').onclick=()=>{let n=prompt('Nouveau nom :',s.name);if(n!==null&&n.trim()){s.name=n.trim();put(s).then(async()=>{state.sounds=await all();o.remove();render();note('Nom modifié')})}};o.querySelector('#deleteBtn').onclick=()=>{a.pause();URL.revokeObjectURL(url);o.remove();remove(id)}}
function trimModal(id){let s=state.sounds.find(x=>x.id===id),originalStart=s.trimStart??0,originalEnd=s.trimEnd??s.duration,a=originalStart,b=originalEnd,o=overlay(`<h2>Rogner le son</h2><p class="muted">Le fichier original restera intact.</p><div class="trim-wrap"><div class="wave" id="trimWave"><canvas></canvas><i class="progress" id="trimProgress"></i></div><i class="trim-shade left" id="shadeL"></i><i class="trim-shade right" id="shadeR"></i><div class="handles"><i class="handle" id="handleL"></i><i class="handle" id="handleR"></i></div></div><div class="trim-controls"><label>Début <input type="range" id="startTrim" min="0" max="${s.duration}" step="0.05" value="${a}"></label><label>Fin <input type="range" id="endTrim" min="0" max="${s.duration}" step="0.05" value="${b}"></label></div><p class="selection" id="selectedDuration"></p><div class="detail-grid"><button class="secondary" id="previewTrim">▶ Préécouter</button><button class="secondary" id="restoreTrim">↺ Restaurer l'original</button></div><div class="actions"><button class="secondary" id="cancelTrim">Annuler</button><button class="primary" id="saveTrim">Valider</button></div>`);draw(o.querySelector('canvas'),s.peaks);let startInput=o.querySelector('#startTrim'),endInput=o.querySelector('#endTrim'),url=URL.createObjectURL(s.blob),audio=new Audio(url),preview=o.querySelector('#previewTrim'),progress=o.querySelector('#trimProgress');function update(changed){a=+startInput.value;b=+endInput.value;if(b-a<.3){if(changed==='start')a=Math.max(0,b-.3);else b=Math.min(s.duration,a+.3);startInput.value=a;endInput.value=b}let lp=a/s.duration*100,rp=b/s.duration*100;o.querySelector('#shadeL').style.width=lp+'%';o.querySelector('#shadeR').style.width=(100-rp)+'%';o.querySelector('#handleL').style.left=lp+'%';o.querySelector('#handleR').style.left=rp+'%';o.querySelector('#selectedDuration').textContent=fmt(b-a)}function stopPreview(){audio.pause();audio.currentTime=a;preview.textContent='▶ Préécouter';progress.style.left=(a/s.duration*100)+'%'}audio.ontimeupdate=()=>{progress.style.left=(audio.currentTime/s.duration*100)+'%';if(audio.currentTime>=b)stopPreview()};startInput.oninput=()=>{stopPreview();update('start')};endInput.oninput=()=>{stopPreview();update('end')};preview.onclick=()=>{if(audio.paused){audio.currentTime=a;audio.play();preview.textContent='⏸ Pause'}else stopPreview()};o.querySelector('#restoreTrim').onclick=()=>{stopPreview();startInput.value=0;endInput.value=s.duration;update()};o.querySelector('#cancelTrim').onclick=()=>{audio.pause();URL.revokeObjectURL(url);o.remove();detail(id)};o.querySelector('#saveTrim').onclick=async()=>{audio.pause();URL.revokeObjectURL(url);s.trimStart=a;s.trimEnd=b;await put(s);state.sounds=await all();o.remove();render();note('Rognage enregistré')};update()}

(async()=>{try{state.sounds=await all()}catch{note('Le stockage local est indisponible.')}render()})();
</script></body></html>
